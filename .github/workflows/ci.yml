name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Prisma Generate
        run: |
          cd backend
          npx prisma generate

      - name: TypeScript Compile Check
        run: |
          cd backend
          npm run build

      - name: Backend Security Audit
        run: |
          cd backend
          npm audit --audit-level=high || true

  web-ci:
    name: Web Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package.json'

      - name: Install Dependencies
        run: |
          cd web
          npm install

      - name: Type Check NextJS
        run: |
          cd web
          npm run typecheck

      - name: NextJS Build Validation
        run: |
          cd web
          npm run build

  mobile-ci:
    name: Mobile CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'mobile/package.json'

      - name: Install Dependencies
        run: |
          cd mobile
          npm install

      - name: TypeScript check Expo App
        run: |
          cd mobile
          npm run ts:check
