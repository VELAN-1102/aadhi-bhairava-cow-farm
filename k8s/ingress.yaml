apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cow-farm-ingress
  namespace: aadhi-bhairava-cow-farm
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts:
        - www.aadhibhairavacowfarm.com
        - api.aadhibhairavacowfarm.com
      secretName: cowfarm-tls-cert
  rules:
    - host: www.aadhibhairavacowfarm.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 3000
    - host: api.aadhibhairavacowfarm.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
